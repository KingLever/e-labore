<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>E-Labore | Entrar</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-secondary-subtle">
  <div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card rounded-5 shadow border-0 w-100" style="max-width: 390px;">
      <div class="card-body p-4">
        <h1 class="h5 text-center mb-4">Entrar no sistema</h1>

        <div id="aviso" class="alert d-none py-2 small" role="alert"></div>

        <form action="/login" method="post">
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control border-dark" id="email" name="email" placeholder="Digite seu email" required>
          </div>

          <div class="mb-2">
            <label for="senha" class="form-label">Senha</label>
            <input type="password" class="form-control border-dark" id="senha" name="senha" placeholder="Digite sua senha" required>
          </div>

          <a href="#" class="d-block small text-secondary mb-4">Esqueceu sua senha? Clique aqui.</a>

          <div class="text-center mb-3">
            <button type="submit" class="btn btn-outline-dark rounded-pill px-4">Entrar</button>
          </div>

          <p class="text-center small mb-0">
            Não tem conta? <a href="cadastro.html">Cadastre-se</a>
          </p>
        </form>
      </div>
    </div>
  </div>

  <script>
    const p = new URLSearchParams(location.search);
    const msgs = {
      'erro=credenciais': ['alert-danger', 'Email ou senha inválidos.'],
      'erro=servidor': ['alert-danger', 'Serviço indisponível. Tente novamente.'],
      'cadastro=ok': ['alert-success', 'Cadastro feito! Entre com seu email e senha.']
    };
    for (const [k, [cls, txt]] of Object.entries(msgs)) {
      const [n, v] = k.split('=');
      if (p.get(n) === v) {
        const a = document.getElementById('aviso');
        a.className = 'alert py-2 small ' + cls;
        a.textContent = txt;
      }
    }
  </script>
</body>
</html>
