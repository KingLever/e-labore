<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>E-Labore | Cadastro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-secondary-subtle">
  <div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <div class="card rounded-5 shadow border-0 w-100" style="max-width: 390px;">
      <div class="card-body p-4">
        <h1 class="h5 text-center mb-4">Criar conta</h1>

        <div id="aviso" class="alert alert-danger d-none py-2 small" role="alert"></div>

        <form action="/cadastro" method="post">
          <div class="mb-3">
            <label for="nome" class="form-label">Nome</label>
            <input type="text" class="form-control border-dark" id="nome" name="nome" placeholder="Digite seu nome" required>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control border-dark" id="email" name="email" placeholder="Digite seu email" required>
          </div>

          <div class="mb-4">
            <label for="senha" class="form-label">Senha</label>
            <input type="password" class="form-control border-dark" id="senha" name="senha" placeholder="Crie uma senha" minlength="6" required>
          </div>

          <div class="text-center mb-3">
            <button type="submit" class="btn btn-outline-dark rounded-pill px-4">Cadastrar</button>
          </div>

          <p class="text-center small mb-0">
            Já tem conta? <a href="login.html">Entrar</a>
          </p>
        </form>
      </div>
    </div>
  </div>

  <script>
    const msgs = {
      dados: 'Confira os dados. A senha precisa ter pelo menos 6 caracteres.',
      email: 'Este email já está cadastrado.',
      servidor: 'Serviço indisponível. Tente novamente.'
    };
    const erro = new URLSearchParams(location.search).get('erro');
    if (msgs[erro]) {
      const a = document.getElementById('aviso');
      a.textContent = msgs[erro];
      a.classList.remove('d-none');
    }
  </script>
</body>
</html>
